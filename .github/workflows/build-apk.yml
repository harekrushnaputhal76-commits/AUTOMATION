name: Build & Release Capacitor Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'docs/**'
      - 'nextplay/**'
      - 'game/nextplay/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Capacitor Directory & Web Assets
        run: |
          # Detect Capacitor directory
          if [ -d "game/nextplay" ]; then
            CAP_DIR="game/nextplay"
          elif [ -d "nextplay" ]; then
            CAP_DIR="nextplay"
          else
            echo "Error: Neither game/nextplay nor nextplay directory found!"
            exit 1
          fi
          echo "Selected Capacitor directory: $CAP_DIR"
          echo "CAP_DIR=$CAP_DIR" >> $GITHUB_ENV

          # Synchronize latest root web assets into public/
          mkdir -p $CAP_DIR/public/css $CAP_DIR/public/js
          cp -f index.html $CAP_DIR/public/index.html
          cp -f css/style.css $CAP_DIR/public/css/style.css
          cp -f js/app.js $CAP_DIR/public/js/app.js
          echo "Synchronized web portal assets to $CAP_DIR/public"

      - name: Install Dependencies
        run: |
          cd $CAP_DIR
          npm install

      - name: Add Android Platform & Sync Capacitor
        run: |
          cd $CAP_DIR
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd $CAP_DIR/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare & Verify Generated APK
        run: |
          APK_FOUND=$(find $CAP_DIR/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ] || [ ! -f "$APK_FOUND" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found generated APK: $APK_FOUND"
          cp "$APK_FOUND" $GITHUB_WORKSPACE/nexplay-arcade.apk
          ls -lh $GITHUB_WORKSPACE/nexplay-arcade.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexplay-arcade-apk
          path: nexplay-arcade.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "NexPlay Arcade - Android APK Build"
          body: |
            ### 🎮 NexPlay Arcade - Official Android APK
            
            This APK was automatically built by GitHub Actions from the latest Capacitor repository source code.
            
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **Target Platform**: Android (Capacitor Native WebView Shell)
            
            #### 📥 Direct Download
            Click below to download directly to your Android device:
            👉 **[Download nexplay-arcade.apk](https://github.com/${{ github.repository }}/releases/latest/download/nexplay-arcade.apk)**
          files: nexplay-arcade.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
